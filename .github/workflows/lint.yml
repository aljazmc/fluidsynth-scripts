name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
      # shellcheck comes with the ubuntu-latest runner
      # and with aljazmc/actions-debian for self-hosted
      # testing with act
      - run: shellcheck --version
      - run: shellcheck project.sh tests/sh/*.sh

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
      - uses: astral-sh/ruff-action@v3
        with:
          version: 0.17.6
          args: check --output-format=github
